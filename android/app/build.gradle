import groovy.io.FileType
import groovy.json.JsonSlurper
import java.nio.file.Files
import java.security.MessageDigest

apply plugin: 'com.android.application'

// Clé de signature release : HORS du dépôt (~/.fa-secrets/android/), jamais
// versionnée. Créée une fois par scripts/creer-cle-release.mjs. Sans elle,
// `assembleRelease` s'arrête avec un message clair au lieu de produire une
// APK non signée (ininstallable) qu'on croirait bonne.
def propsCle = new Properties()
def fichierCle = file(System.getenv("FA_KEYSTORE_PROPS") ?: "${System.properties['user.home']}/.fa-secrets/android/keystore.properties")
def aCle = fichierCle.exists()
if (aCle) { fichierCle.withInputStream { propsCle.load(it) } }

android {
    namespace "com.fractalarena.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fractalarena.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 386
        versionName "1.0 (client v386)"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (aCle) {
                storeFile file(propsCle['storeFile'])
                storePassword propsCle['storePassword']
                keyAlias propsCle['keyAlias']
                keyPassword propsCle['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (aCle) { signingConfig signingConfigs.release }
        }
    }
}

// Une tâche Gradle lancée directement ne doit pas contourner le contrôle des
// scripts Node. Le reçu copié avec les assets lie chaque octet à FA_WEB_COMMIT ;
// un `cap sync` de développement ne produit volontairement aucun reçu.
def depotWebAttendu = 'github.com/Arthefacte/fractal-arena-web'
def nomProvenanceWeb = 'release-provenance.json'
def empreinteAssetsWeb = { File racine ->
    def fichiers = []
    racine.eachFileRecurse(FileType.ANY) { f ->
        def rel = racine.toPath().relativize(f.toPath()).toString().replace(File.separatorChar, '/' as char)
        if (Files.isSymbolicLink(f.toPath())) {
            throw new GradleException("Assets web non sûrs : lien symbolique interdit : " + rel)
        }
        if (f.isFile() && rel != nomProvenanceWeb) fichiers << [chemin: rel, fichier: f]
        else if (!f.isFile() && !f.isDirectory()) {
            throw new GradleException("Assets web non sûrs : entrée non régulière : " + rel)
        }
    }
    fichiers.sort { a, b -> a.chemin <=> b.chemin }
    def digest = MessageDigest.getInstance('SHA-256')
    fichiers.each { entree ->
        byte[] contenu = entree.fichier.bytes
        digest.update(entree.chemin.getBytes('UTF-8'))
        digest.update((byte) 0)
        digest.update(String.valueOf(contenu.length).getBytes('UTF-8'))
        digest.update((byte) 0)
        digest.update(contenu)
        digest.update((byte) 0)
    }
    return digest.digest().encodeHex().toString()
}

def verificationProvenanceRelease = tasks.register('verifyReleaseWebProvenance') {
    group = 'verification'
    description = 'Refuse une release Android qui ne provient pas du commit web approuvé.'
    doLast {
        def commitApprouve = (System.getenv('FA_WEB_COMMIT') ?: '').toLowerCase(Locale.ROOT)
        if (!(commitApprouve ==~ /[0-9a-f]{40}/)) {
            throw new GradleException('FA_WEB_COMMIT doit contenir le SHA-1 complet du client web approuvé')
        }
        def racine = file('src/main/assets/public')
        def recu = new File(racine, nomProvenanceWeb)
        if (!racine.isDirectory() || !recu.isFile() || Files.isSymbolicLink(recu.toPath())) {
            throw new GradleException('Reçu de provenance web absent : exécuter scripts/build-release.mjs')
        }
        def provenance
        try { provenance = new JsonSlurper().parse(recu) }
        catch (Exception e) { throw new GradleException('Reçu de provenance web illisible', e) }
        if (provenance.schemaVersion != 1 || provenance.repository != depotWebAttendu) {
            throw new GradleException('Dépôt web inattendu dans le reçu de provenance')
        }
        if (provenance.webCommit != commitApprouve || !(provenance.webTree ==~ /[0-9a-f]{40}/)) {
            throw new GradleException('Les assets Android ne correspondent pas au commit web approuvé')
        }
        if (!(provenance.generatedTreeSha256 ==~ /[0-9a-f]{64}/)
                || empreinteAssetsWeb(racine) != provenance.generatedTreeSha256) {
            throw new GradleException('Les assets Android ont changé depuis la génération approuvée')
        }
    }
}

tasks.configureEach { t ->
    if (t.name == 'preReleaseBuild') t.dependsOn(verificationProvenanceRelease)
}

tasks.whenTaskAdded { t ->
    if (!aCle && (t.name == 'assembleRelease' || t.name == 'bundleRelease')) {
        t.doFirst {
            throw new GradleException("Clé de signature absente : " + fichierCle + " — la créer avec node scripts/creer-cle-release.mjs")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// Le plugin de mise à jour tire androidx.work 2.10.5, qui exige compileSdk 35.
// Ce projet est resté sur le template Capacitor 6.0 (compileSdk 34) : on force
// la dernière version compatible 34 au lieu de monter toute la chaîne AGP/SDK
// maintenant. L'API utilisée par le plugin (travail en arrière-plan) est stable
// d'une version à l'autre. Monter en SDK 35 est un chantier à part — il le
// faudra pour publier sur le Play Store, pas pour installer l'APK directement.
configurations.all {
    resolutionStrategy {
        force 'androidx.work:work-runtime:2.9.0'
        force 'androidx.work:work-runtime-ktx:2.9.0'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
