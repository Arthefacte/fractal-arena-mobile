apply plugin: 'com.android.application'

// Clé de signature release : HORS du dépôt (~/.fa-secrets/android/), jamais
// versionnée. Créée une fois par scripts/creer-cle-release.mjs. Sans elle,
// `assembleRelease` s'arrête avec un message clair au lieu de produire une
// APK non signée (ininstallable) qu'on croirait bonne.
def propsCle = new Properties()
def fichierCle = file(System.getenv("FA_KEYSTORE_PROPS") ?: "${System.properties['user.home']}/.fa-secrets/android/keystore.properties")
def aCle = fichierCle.exists()
if (aCle) { fichierCle.withInputStream { propsCle.load(it) } }

android {
    namespace "com.fractalarena.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fractalarena.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 342
        versionName "1.0 (client v342)"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (aCle) {
                storeFile file(propsCle['storeFile'])
                storePassword propsCle['storePassword']
                keyAlias propsCle['keyAlias']
                keyPassword propsCle['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (aCle) { signingConfig signingConfigs.release }
        }
    }
}

tasks.whenTaskAdded { t ->
    if (!aCle && (t.name == 'assembleRelease' || t.name == 'bundleRelease')) {
        t.doFirst {
            throw new GradleException("Clé de signature absente : " + fichierCle + " — la créer avec node scripts/creer-cle-release.mjs")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// Le plugin de mise à jour tire androidx.work 2.10.5, qui exige compileSdk 35.
// Ce projet est resté sur le template Capacitor 6.0 (compileSdk 34) : on force
// la dernière version compatible 34 au lieu de monter toute la chaîne AGP/SDK
// maintenant. L'API utilisée par le plugin (travail en arrière-plan) est stable
// d'une version à l'autre. Monter en SDK 35 est un chantier à part — il le
// faudra pour publier sur le Play Store, pas pour installer l'APK directement.
configurations.all {
    resolutionStrategy {
        force 'androidx.work:work-runtime:2.9.0'
        force 'androidx.work:work-runtime-ktx:2.9.0'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
